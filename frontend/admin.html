<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin · Poonawalla Fincorp Loan Wizard</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --blue:       #1a4fd6;
  --blue-2:     #2563eb;
  --blue-3:     #3b82f6;
  --blue-light: #eff6ff;
  --navy:       #0f1e3d;
  --navy-2:     #1e3a5f;
  --white:      #ffffff;
  --gray-50:    #f8fafc;
  --gray-100:   #f1f5f9;
  --gray-200:   #e2e8f0;
  --gray-400:   #94a3b8;
  --gray-500:   #64748b;
  --gray-700:   #334155;
  --gray-900:   #0f172a;
  --green:      #16a34a;
  --green-light:#dcfce7;
  --red:        #dc2626;
  --red-light:  #fee2e2;
  --gold:       #f59e0b;
  --gold-light: #fef9c3;
  --line:       rgba(15,30,61,.1);
  --shadow:     0 20px 48px -12px rgba(15,30,61,.18);
  --shadow-sm:  0 4px 12px -2px rgba(15,30,61,.1);
  --sans:       'Manrope', -apple-system, sans-serif;
  --mono:       'JetBrains Mono', monospace;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: var(--sans); color: var(--gray-900); background: var(--gray-50); -webkit-font-smoothing: antialiased; }
button { font-family: inherit; cursor: pointer; border: none; background: none; }
a { text-decoration: none; color: inherit; }

/* ---- Header ---- */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 28px;
  background: var(--white);
  border-bottom: 1px solid var(--gray-200);
  position: sticky; top: 0; z-index: 20;
}
.brand { display: flex; align-items: center; gap: 12px; }
.brand-logo {
  width: 38px; height: 38px; background: var(--navy);
  border-radius: 9px; display: grid; place-items: center;
  color: var(--white); font-weight: 800; font-size: 15px;
}
.brand-name { font-size: 15px; font-weight: 700; color: var(--navy); line-height: 1.15; }
.brand-sub { font-size: 11px; color: var(--gray-400); font-weight: 500; letter-spacing: .3px; }

.topbar-right { display: flex; gap: 10px; align-items: center; }
.refresh-btn {
  padding: 8px 16px;
  background: var(--navy); color: var(--white);
  font-size: 12px; font-weight: 700;
  border-radius: 8px; transition: all .2s;
}
.refresh-btn:hover { background: var(--navy-2); }
.home-link {
  padding: 8px 14px;
  border: 1.5px solid var(--gray-200); border-radius: 8px;
  font-size: 12px; font-weight: 600; color: var(--gray-700);
  transition: all .2s;
}
.home-link:hover { border-color: var(--blue-3); color: var(--blue); }

/* ---- Layout ---- */
.layout { display: grid; grid-template-columns: 340px 1fr; height: calc(100vh - 73px); }

/* ---- Sidebar ---- */
aside {
  background: var(--white);
  border-right: 1px solid var(--gray-200);
  overflow-y: auto;
  display: flex; flex-direction: column;
}
.sidebar-head {
  padding: 20px 22px 16px;
  border-bottom: 1px solid var(--gray-200);
  position: sticky; top: 0; background: var(--white); z-index: 2;
}
.sidebar-head .slabel { font-size: 10px; font-weight: 700; letter-spacing: 2px; color: var(--gray-400); text-transform: uppercase; margin-bottom: 6px; }
.sidebar-head .count { font-size: 38px; font-weight: 800; color: var(--navy); letter-spacing: -1.5px; line-height: 1; }

.session-item {
  padding: 14px 22px;
  border-bottom: 1px solid var(--gray-100);
  cursor: pointer;
  transition: background .15s;
}
.session-item:hover { background: var(--gray-50); }
.session-item.active { background: var(--blue); color: var(--white); }
.session-item.active .smeta { color: rgba(255,255,255,.65); }
.session-item.active .badge-completed { background: rgba(255,255,255,.2); color: var(--white); }
.session-item.active .badge-active-s { background: rgba(255,255,255,.2); color: var(--white); }
.session-item.active .badge-consent { background: rgba(255,255,255,.15); color: rgba(255,255,255,.8); }
.sid { font-family: var(--mono); font-size: 11.5px; font-weight: 500; margin-bottom: 3px; }
.smeta { font-size: 11px; color: var(--gray-400); margin-bottom: 8px; }
.sbadges { display: flex; gap: 6px; flex-wrap: wrap; }
.badge {
  font-size: 10px; font-weight: 700; padding: 3px 9px;
  border-radius: 999px; letter-spacing: .5px; text-transform: uppercase;
}
.badge-completed { background: var(--green-light); color: var(--green); }
.badge-active-s  { background: var(--gold-light); color: #854d0e; }
.badge-consent   { background: var(--blue-light); color: var(--blue); }

.empty { color: var(--gray-400); padding: 40px; text-align: center; font-size: 13px; }

/* ---- Main detail ---- */
main { overflow-y: auto; padding: 28px 32px; background: var(--gray-50); }

/* ---- Detail head ---- */
.detail-head {
  display: flex; align-items: flex-start; justify-content: space-between;
  margin-bottom: 24px;
}
.detail-head h2 { font-size: 30px; font-weight: 800; color: var(--navy); letter-spacing: -.8px; }
.detail-head .detail-sid { font-family: var(--mono); font-size: 12px; color: var(--gray-400); margin-top: 4px; }

/* ---- Decision banner ---- */
.decision-banner {
  border-radius: 14px;
  padding: 22px 26px;
  margin-bottom: 22px;
}
.decision-banner.approve { background: linear-gradient(135deg, var(--navy) 0%, #1e3a8a 100%); color: var(--white); }
.decision-banner.refer   { background: linear-gradient(135deg, #78350f 0%, #92400e 100%); color: var(--white); }
.decision-banner.reject  { background: linear-gradient(135deg, #7f1d1d 0%, #991b1b 100%); color: var(--white); }
.decision-banner.unknown { background: var(--gray-700); color: var(--white); }
.db-label { font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,.55); margin-bottom: 10px; }
.db-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
.db-num { font-size: 28px; font-weight: 800; letter-spacing: -1px; }
.db-lbl { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: rgba(255,255,255,.6); margin-top: 3px; }

/* ---- Cards grid ---- */
.cards-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-bottom: 22px; }
.card {
  background: var(--white); border: 1.5px solid var(--gray-200);
  border-radius: 14px; padding: 20px 22px;
  box-shadow: var(--shadow-sm);
}
.card h3 { font-size: 10px; font-weight: 700; letter-spacing: 1.8px; text-transform: uppercase; color: var(--gray-400); margin-bottom: 14px; }
.kv { display: flex; flex-direction: column; gap: 0; }
.kv-row { display: grid; grid-template-columns: 130px 1fr; padding: 8px 0; border-bottom: 1px dashed var(--gray-100); font-size: 13px; }
.kv-row:last-child { border: none; }
.k { color: var(--gray-400); font-size: 12px; font-weight: 500; }
.v { font-weight: 600; color: var(--gray-900); word-break: break-all; }
.v.good { color: var(--green); }
.v.bad  { color: var(--red); }

/* ---- Transcript ---- */
.transcript-card {
  background: var(--white); border: 1.5px solid var(--gray-200);
  border-radius: 14px; padding: 20px;
  margin-bottom: 22px;
  box-shadow: var(--shadow-sm);
}
.transcript-card h3 { font-size: 16px; font-weight: 700; color: var(--navy); margin-bottom: 14px; }
.transcript-scroll { max-height: 340px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
.turn {
  padding: 9px 13px; border-radius: 9px;
  font-size: 12.5px; line-height: 1.5;
}
.turn.agent { background: var(--gray-50); border-left: 3px solid var(--blue-3); }
.turn.customer { background: linear-gradient(135deg, var(--navy), var(--navy-2)); color: var(--white); margin-left: 28px; }
.turn .who { font-size: 9.5px; letter-spacing: 1.2px; font-weight: 700; opacity: .6; margin-bottom: 3px; display: flex; justify-content: space-between; }
.turn .ts { opacity: .5; }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="brand-logo">P</div>
    <div>
      <div class="brand-name">Poonawalla Fincorp — Loan Wizard</div>
      <div class="brand-sub">Compliance · Audit · Operations</div>
    </div>
  </div>
  <div class="topbar-right">
    <button class="refresh-btn" onclick="loadSessions()">↻ Refresh</button>
    <a class="home-link" href="/">← Back to Home</a>
  </div>
</header>

<div class="layout">
  <aside>
    <div class="sidebar-head">
      <div class="slabel">Total Sessions</div>
      <div class="count" id="count">0</div>
    </div>
    <div id="sessionList"><div class="empty">No sessions yet.</div></div>
  </aside>

  <main>
    <div id="detail" class="empty">Select a session from the left to see details.</div>
  </main>
</div>

<script>
const $ = id => document.getElementById(id);
let sessions = [];
let currentSid = null;

async function loadSessions() {
  const r = await fetch('/api/sessions').then(r => r.json());
  sessions = r.sessions || [];
  $('count').textContent = sessions.length;
  const list = $('sessionList');
  if (!sessions.length) { list.innerHTML = '<div class="empty">No sessions yet.</div>'; return; }
  list.innerHTML = sessions.map(s => `
    <div class="session-item ${s.session_id === currentSid ? 'active' : ''}" data-sid="${s.session_id}">
      <div class="sid">${s.session_id}</div>
      <div class="smeta">${new Date(s.started_at + 'Z').toLocaleString()}</div>
      <div class="sbadges">
        <span class="badge ${s.status === 'completed' ? 'badge-completed' : 'badge-active-s'}">${s.status}</span>
        ${s.consent_given ? '<span class="badge badge-consent">consent ✓</span>' : ''}
      </div>
    </div>
  `).join('');
  list.querySelectorAll('.session-item').forEach(el => {
    el.addEventListener('click', () => loadDetail(el.dataset.sid));
  });
}

async function loadDetail(sid) {
  currentSid = sid;
  document.querySelectorAll('.session-item').forEach(el => {
    el.classList.toggle('active', el.dataset.sid === sid);
  });
  const r = await fetch('/api/session/' + sid + '/report').then(r => r.json());
  $('detail').classList.remove('empty');
  $('detail').innerHTML = renderDetail(r);
}

function renderDetail(r) {
  const s   = r.session || {};
  const e   = r.extracted_data || {};
  const risk = r.risk;
  const off  = r.offer && r.offer.offer_json;

  const fmt = v => (v == null || v === '') ? '—' : v;
  const fmtMoney = v => v == null ? '—' : '₹' + Number(v).toLocaleString('en-IN');
  const dec = risk?.decision || 'UNKNOWN';
  const decClass = dec === 'APPROVE' ? 'approve' : dec === 'REJECT' ? 'reject' : dec === 'REFER' ? 'refer' : 'unknown';

  let bannerHTML = '';
  if (off && off.eligible) {
    const po = off.primary_offer;
    bannerHTML = `
      <div class="decision-banner ${decClass}">
        <div class="db-label">Generated Offer · ${dec}</div>
        <div class="db-grid">
          <div><div class="db-num">${fmtMoney(po.loan_amount)}</div><div class="db-lbl">Loan Amount</div></div>
          <div><div class="db-num">${po.tenure_months} mo</div><div class="db-lbl">Tenure</div></div>
          <div><div class="db-num">${po.interest_rate}%</div><div class="db-lbl">Interest</div></div>
          <div><div class="db-num">${fmtMoney(Math.round(po.emi))}</div><div class="db-lbl">Monthly EMI</div></div>
        </div>
      </div>`;
  } else if (risk) {
    bannerHTML = `
      <div class="decision-banner ${decClass}">
        <div class="db-label">Decision · ${dec}</div>
        <div style="font-size:13px;opacity:.85;">No offer generated. Reasons: ${(risk.reasons||[]).join(', ')||'—'}</div>
      </div>`;
  }

  const transcripts = (r.transcripts || []).map(t => `
    <div class="turn ${t.speaker}">
      <div class="who">${t.speaker.toUpperCase()} <span class="ts">${new Date(t.timestamp+'Z').toLocaleTimeString()}</span></div>
      ${escapeHtml(t.text)}
    </div>`).join('');

  return `
    <div class="detail-head">
      <div>
        <h2>Session Detail</h2>
        <div class="detail-sid">${s.session_id || '—'}</div>
      </div>
    </div>

    ${bannerHTML}

    <div class="cards-grid">
      <div class="card">
        <h3>Customer Profile</h3>
        <div class="kv">
          <div class="kv-row"><div class="k">Name</div><div class="v">${fmt(e.full_name)}</div></div>
          <div class="kv-row"><div class="k">Declared Age</div><div class="v">${fmt(e.declared_age)}</div></div>
          <div class="kv-row"><div class="k">Estimated Age</div><div class="v">${fmt(e.estimated_age)}</div></div>
          <div class="kv-row"><div class="k">Employment</div><div class="v">${fmt(e.employment_type)}</div></div>
          <div class="kv-row"><div class="k">Employer</div><div class="v">${fmt(e.employer_name)}</div></div>
          <div class="kv-row"><div class="k">Income</div><div class="v">${fmtMoney(e.monthly_income)}</div></div>
          <div class="kv-row"><div class="k">Loan Purpose</div><div class="v">${fmt(e.loan_purpose)}</div></div>
          <div class="kv-row"><div class="k">Requested</div><div class="v">${fmtMoney(e.loan_amount_requested)}</div></div>
          <div class="kv-row"><div class="k">PAN</div><div class="v">${fmt(e.pan)}</div></div>
        </div>
      </div>

      <div class="card">
        <h3>Risk &amp; Compliance</h3>
        <div class="kv">
          <div class="kv-row"><div class="k">Decision</div><div class="v ${risk?.decision === 'APPROVE' ? 'good' : risk?.decision === 'REJECT' ? 'bad' : ''}">${fmt(risk?.decision)}</div></div>
          <div class="kv-row"><div class="k">Risk Score</div><div class="v">${fmt(risk?.risk_score)} / 100</div></div>
          <div class="kv-row"><div class="k">Risk Band</div><div class="v">${fmt(risk?.risk_band)}</div></div>
          <div class="kv-row"><div class="k">Bureau Score</div><div class="v">${fmt(risk?.bureau_score)}</div></div>
          <div class="kv-row"><div class="k">Propensity</div><div class="v">${fmt(risk?.propensity_score)} / 100</div></div>
          <div class="kv-row"><div class="k">IP Address</div><div class="v">${fmt(s.ip_address)}</div></div>
          <div class="kv-row"><div class="k">Geo</div><div class="v">${s.geo_lat ? `${s.geo_lat.toFixed(3)}, ${s.geo_lng.toFixed(3)}` : '—'}</div></div>
          <div class="kv-row"><div class="k">Consent</div><div class="v ${s.consent_given ? 'good' : 'bad'}">${s.consent_given ? '✓ Captured' : '✗ Missing'}</div></div>
          <div class="kv-row"><div class="k">Reasons</div><div class="v">${(risk?.reasons || []).join(', ') || '—'}</div></div>
        </div>
      </div>
    </div>

    <div class="transcript-card">
      <h3>Conversation Transcript</h3>
      <div class="transcript-scroll">
        ${transcripts || '<div class="empty">No transcript captured.</div>'}
      </div>
    </div>
  `;
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

loadSessions();
setInterval(loadSessions, 8000);
</script>
</body>
</html>
